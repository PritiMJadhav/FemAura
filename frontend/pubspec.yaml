name: frontend
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^0.13.6
  shared_preferences: ^2.2.2
  fl_chart: ^0.68.0
  audioplayers: ^5.2.1
  turn_page_transition: ^0.5.0
  cupertino_icons: ^1.0.8
  percent_indicator: ^4.2.5
  intl: ^0.19.0
  image_picker: ^1.1.2
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/Profile.jpg
    - assets/logo.png
    - assets/slide1.png
    - assets/slide2.png
    - assets/slide3.png
    - assets/slide4.png
    - assets/slide5.png
    - assets/profile.png
    - assets/audio/meditation1.mp3
    - assets/audio/meditation2.mp3
    - assets/audio/calm1.mp3
    - assets/audio/calm2.mp3
    - assets/morning.jpg
    - assets/evening.jpg
    - assets/music1.jpg
    - assets/music2.jpg
    - assets/Baby_Bump.png
    - assets/Ardha Matsyendrasana.png
    - assets/Eka Pada Rajakapotasana.png
    - assets/Halasana.png
    - assets/Niravalasana.png
    - assets/Supta Matsyendrasana.png
    - assets/Sukhasana.png
    - assets/Seated Side Stretch.png
    - assets/Parighasana.png
    - assets/Setu Bandhasana.png
    - assets/Supported Bridge.png
    - assets/bubble_game/images/game_bg.jpg
    - assets/bubble_game/images/start_bg.jpg
    - assets/bubble_game/sounds/calm_bg.mp3    
    - assets/bubble_game/sounds/tap.mp3
    - assets/common/puzzle_icon.png
    - assets/common/bubble_icon.png
    - assets/common/menu_bg.jpg
    - assets/puzzle_game/manifest.json
    - assets/puzzle_game/images/easy/
    - assets/puzzle_game/images/medium/
    - assets/puzzle_game/images/hard/
    - assets/puzzle_game/sounds/click.mp3
    - assets/puzzle_game/sounds/loop.mp3

  fonts:
    - family: Quicksand
      fonts:
        - asset: assets/bubble_game/fonts/Quicksand-Regular.ttf
          weight: 400
        - asset: assets/bubble_game/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/bubble_game/fonts/Quicksand-SemiBold.ttf
          weight: 600
        - asset: assets/bubble_game/fonts/Quicksand-Bold.ttf
          weight: 700
 

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

    